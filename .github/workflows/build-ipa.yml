name: Build Howl IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only collapse superseded PR builds; a push and a manual run of the same
  # commit must not cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    name: Unsigned iOS build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Howl.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/Howl.xcarchive/Products/Applications"
          ls -la "$APP_DIR"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR"/*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Howl-unsigned.ipa Payload
          unzip -l Howl-unsigned.ipa | head -5

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Howl-unsigned-ipa
          path: ${{ runner.temp }}/Howl-unsigned.ipa
          if-no-files-found: error

  release:
    name: Attach IPA to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Howl-unsigned-ipa

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Howl-unsigned.ipa
          generate_release_notes: true
